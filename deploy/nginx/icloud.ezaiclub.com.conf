server {
    listen 80;
    listen [::]:80;
    server_name icloud.ezaiclub.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name icloud.ezaiclub.com;

    ssl_certificate     /etc/nginx/ssl/ezaiclub.com.pem;
    ssl_certificate_key /etc/nginx/ssl/ezaiclub.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/icloud.ezaiclub.com.access.log;
    error_log  /var/log/nginx/icloud.ezaiclub.com.error.log;

    auth_basic "iCloud HME";
    auth_basic_user_file /etc/nginx/.htpasswd-icloud-hme;

    client_max_body_size 2m;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /_icloud_hme_api_key_auth {
        internal;
        auth_basic off;
        proxy_pass http://127.0.0.1:18081/_internal/api-key-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-API-Key $http_x_api_key;
    }

    location ^~ /api/ {
        satisfy any;
        auth_request /_icloud_hme_api_key_auth;

        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
