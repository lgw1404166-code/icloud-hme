services:
  icloud-hme:
    build:
      context: .
      dockerfile: Dockerfile
    image: icloud-hme:local
    container_name: icloud-hme
    restart: unless-stopped
    init: true
    command:
      - -addr
      - :8081
      - -data
      - /app/data
    environment:
      ICLOUD_HME_API_KEY: ${ICLOUD_HME_API_KEY:?set ICLOUD_HME_API_KEY in .env}
      ICLOUD_HME_AUTO_CREATE: ${ICLOUD_HME_AUTO_CREATE:-true}
      ICLOUD_HME_AUTO_CREATE_PER_HOUR: ${ICLOUD_HME_AUTO_CREATE_PER_HOUR:-10}
      ICLOUD_HME_AUTO_CREATE_INTERVAL: ${ICLOUD_HME_AUTO_CREATE_INTERVAL:-}
      ICLOUD_HME_AUTO_CREATE_MAX_TOTAL: ${ICLOUD_HME_AUTO_CREATE_MAX_TOTAL:-0}
      ICLOUD_HME_AUTO_CREATE_LABEL: ${ICLOUD_HME_AUTO_CREATE_LABEL:-}
      ICLOUD_HME_AUTO_CREATE_NOTE: ${ICLOUD_HME_AUTO_CREATE_NOTE:-}
      ICLOUD_HME_RELOGIN_ENABLED: ${ICLOUD_HME_RELOGIN_ENABLED:-false}
      ICLOUD_HME_RELOGIN_MODE: ${ICLOUD_HME_RELOGIN_MODE:-apple_protocol_sms}
      ICLOUD_HME_RELOGIN_APPLE_ID: ${ICLOUD_HME_RELOGIN_APPLE_ID:-}
      ICLOUD_HME_RELOGIN_APPLE_PASSWORD: ${ICLOUD_HME_RELOGIN_APPLE_PASSWORD:-}
      ICLOUD_HME_RELOGIN_OTP_PROVIDER: ${ICLOUD_HME_RELOGIN_OTP_PROVIDER:-smsgate_webhook}
      ICLOUD_HME_RELOGIN_OTP_WEBHOOK_TOKEN: ${ICLOUD_HME_RELOGIN_OTP_WEBHOOK_TOKEN:-}
      ICLOUD_HME_RELOGIN_OTP_TTL: ${ICLOUD_HME_RELOGIN_OTP_TTL:-5m}
      ICLOUD_HME_RELOGIN_MANUAL_URL: ${ICLOUD_HME_RELOGIN_MANUAL_URL:-https://account.apple.com/account/manage/section/privacy}
      ICLOUD_HME_RELOGIN_PROTOCOL_TIMEOUT: ${ICLOUD_HME_RELOGIN_PROTOCOL_TIMEOUT:-3m}
      ICLOUD_HME_ENV_FILE: /app/config/.env
    ports:
      - "127.0.0.1:18081:8081"
    volumes:
      - ./data:/app/data
      - ./.env:/app/config/.env
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/api/accounts"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
