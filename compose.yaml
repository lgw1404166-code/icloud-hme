services:
  icloud-hme:
    build:
      context: .
      dockerfile: Dockerfile
    image: icloud-hme:local
    container_name: icloud-hme
    restart: unless-stopped
    init: true
    command:
      - -addr
      - :8081
      - -data
      - /app/data
    environment:
      ICLOUD_HME_API_KEY: ${ICLOUD_HME_API_KEY:?set ICLOUD_HME_API_KEY in .env}
    ports:
      - "127.0.0.1:18081:8081"
    volumes:
      - ./data:/app/data
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/api/accounts"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
